<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>동장의 난 (서울판)</title><style>html,body{margin:0;height:100%;background:#CFD8CF}</style></head><body><title>동장의 난</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
/* 레이아웃: 화면 전체가 지도. 위는 결재판, 아래는 서류철처럼 올라오는 판. 동네 관공서 서식과 빨간 직인이 이 게임의 얼굴. */
:root{
  --ground:#CFD8CF; --paper:#F7F8F2; --sheet:#FDFDF9; --ink:#17231C; --mute:#5D6A60; --line:#C3CCC1;
  --stamp:#D4321F; --stamp-dark:#A92414; --river:#7DB2CF; --good:#1F7A4D; --neutral:#ECEFE6;
  --col:min(400px,46vw);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
b,strong{font-weight:500}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid #1B4C78;outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
.num{font-variant-numeric:tabular-nums}

/* 결재판 */
#hud{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
#hudTop{display:flex;align-items:baseline;gap:10px;min-width:0}
#who{font-family:var(--display);font-weight:700;font-synthesis:none;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#when{color:var(--mute);font-size:13px;white-space:nowrap}
#menuBtn{margin-left:auto;background:none;border:1px solid var(--ink);border-radius:4px;padding:4px 10px;font-size:13px;font-weight:500;white-space:nowrap}
#cells{display:grid;grid-template-columns:1fr 1fr .76fr 1.24fr;margin-top:6px;border:1px solid var(--ink);border-radius:4px;background:var(--sheet);width:100%;padding:0;text-align:left}
.cell{padding:4px 8px;border-left:1px solid var(--line);min-width:0}
.cell:first-child{border-left:0}
.cell small{display:block;color:var(--mute);font-size:12px;line-height:1.2}
.cell b{display:block;font-size:17px;line-height:1.25;font-weight:500;white-space:nowrap}
.cell i{font-style:normal;font-size:12px;color:var(--good);display:block;line-height:1.2;white-space:nowrap}
.cell i.neg{color:var(--stamp)}
#cPop{letter-spacing:-.3px}

/* 아래쪽 */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;pointer-events:none}
#bottom>*{pointer-events:auto}
#sheet{background:var(--sheet);border-top:2px solid var(--ink);max-height:60dvh;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#dock{display:flex;align-items:stretch;gap:8px;background:var(--paper);border-top:2px solid var(--ink);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#news{flex:1;min-width:0;background:none;border:0;text-align:left;font-size:14px;line-height:1.3;padding:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.7em;align-self:center}
#news.bad{color:var(--stamp-dark);font-weight:500}
#lens{background:var(--sheet);border:1px solid var(--ink);border-radius:4px;padding:0 10px;font-size:13px;white-space:nowrap;min-height:44px}
#next{background:var(--ink);color:#fff;border:0;border-radius:4px;padding:0 16px;font-weight:500;white-space:nowrap;min-height:44px;font-size:15px}
#next:active{transform:translateY(1px)}
#next.go{background:var(--ink)}
#next small{display:block;font-size:11px;font-weight:500;opacity:.85;line-height:1.1;margin-top:1px}
#dock{flex-wrap:wrap}#newsRow{flex:0 0 100%;display:flex;gap:8px;align-items:center;min-width:0}
#todo,#todo2{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:4px;text-align:left;background:#FFF7D6;border:1px solid var(--ink);border-radius:4px;padding:2px 8px 2px 10px;font-size:13px;font-weight:500;min-height:44px;line-height:1.25}
#todo[hidden]~#lens{margin-left:auto}
#todo span{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}#todo span b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#todo span small{font-size:12px;font-weight:400;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}#todo>i{font-style:normal;font-size:18px;line-height:1}#todo .tg{font-style:normal;font-size:11px;font-weight:600;color:#fff;background:#1B4C78;border-radius:3px;padding:1px 4px;vertical-align:1px}#todo .tg.bad{background:var(--stamp)}
#todo[hidden]{display:none}
/* 간단 보기 */
#sheet.peek{max-height:none;overflow:visible;padding-bottom:10px}
.quick{margin-top:6px}.quick .qstat{margin:4px 0 0;font-size:14px;color:var(--mute);line-height:1.4}.quick .qstat b{color:var(--ink)}.quick .qstat.warn{color:var(--stamp-dark)}
.quick .qstat .good{color:var(--good)}
.quick .qrow{display:grid;gap:8px;margin-top:10px}.quick .qrow.two{grid-template-columns:1.3fr 1fr}
.quick .btn{min-height:50px}.quick .btn .pct{font-size:17px;margin-left:4px}
.quick .qmore{background:none;border:1px solid var(--line);color:var(--mute);font-weight:500;min-height:38px}
.quick .tip{margin:8px 0 0}
.quick .qlbl{margin:10px 0 0;font-size:12px;color:var(--mute)}
.qdevs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.qdev{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:1px solid var(--ink);border-radius:4px;padding:8px 8px;font:inherit;font-size:13px;color:inherit;min-height:56px;text-align:left}
.qdev:disabled{opacity:.45}.qdev em{font-style:normal;font-size:11px;letter-spacing:0;color:var(--mute)}.qdev b{font-size:14px}
.qdev .dd{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
#rpBlock{position:fixed;inset:0;z-index:30;background:transparent;cursor:pointer}
#rpBar{position:absolute;z-index:31;display:flex;align-items:center;gap:6px;background:#17231C;color:#fff;border-radius:4px;padding:4px 6px 4px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#rpBar[hidden]{display:none}
#next.nudge{animation:nudge .5s}@keyframes nudge{0%,100%{transform:none}30%{transform:translateY(-4px)}60%{transform:translateY(2px)}}
.stampMark.sm{width:48px;height:48px;margin:-24px 0 0 -24px;font-size:14px;border-width:3px}.stampMark.long.sm{width:60px;height:60px;margin:-30px 0 0 -30px;font-size:13px;padding:4px}
.btn.arm,.chip.arm,.rowBtn.arm{background:var(--stamp)!important;color:#fff!important;border-color:var(--stamp)!important}.rowBtn.arm span{color:#fff}
#undo{flex:none;background:var(--sheet);border:1px solid var(--ink);border-radius:4px;padding:0 10px;font-size:13px;font-weight:500;min-height:36px;white-space:nowrap}#undo[hidden]{display:none}
.unlT{margin:8px 0 2px;font-size:12px;color:var(--mute)}.unl{margin:0 0 8px;padding:0;list-style:none;text-align:left}.unl li{padding:6px 0;border-top:1px solid #E6E9E0;font-size:14px}.unl li:first-child{border-top:0}
.chips.pq{margin:2px 0 10px;gap:4px}.chips.pq .chip{min-height:40px;font-size:13px;padding:0}.chips.pq i{flex:0 0 6px}
.tab{font-size:13px}
#legend .lo{display:none;align-items:center;gap:4px}#legend.occ .lo{display:inline-flex}#legend.occ .lr{display:none}
#legend .sw{display:inline-block;width:12px;height:12px;border-radius:2px;background:#E2E6DA;border:1px solid var(--line)}#legend .sw.own{background:var(--stamp)}#legend .sw.pup{background:#EA998F}
.pupTop{display:flex;gap:10px;align-items:center;margin:10px 0}.pupTop img{border-radius:50%;flex:none}
.bar.low u{background:var(--stamp)}
.chips.wrap{flex-wrap:wrap}.chips.wrap .chip{flex:1 1 auto;padding:0 10px}.chip .dot{margin-right:4px}
.spz{font-style:normal;font-size:12px;color:#fff;background:var(--stamp);border-radius:4px;padding:1px 6px;vertical-align:4px}
details.rg summary{gap:8px}.rgN{flex:0 0 38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rgN em{font-style:normal;font-size:11px;color:var(--stamp-dark);font-weight:500;margin-left:2px}
.rgBar{flex:1;position:relative;height:8px;background:#E6E9E0;border-radius:2px;overflow:hidden}.rgBar u{position:absolute;left:0;top:0;bottom:0;background:var(--stamp)}.rgBar i{position:absolute;top:0;bottom:0;background:#EA998F}
.rgC{flex:none;width:56px;text-align:right;font-size:13px;color:var(--mute);line-height:1.15}.rgC small{display:block;font-size:11px;color:var(--stamp-dark)}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.dc{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);font-size:13px;color:var(--mute)}
.dc.own{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:500}.dc.pup{background:#FBE3DF;border-color:#EA998F;color:#17231C}
#menuBtn,#mapBtns button{position:relative}#menuBtn::after,#mapBtns button::after{content:'';position:absolute;left:-4px;right:-4px;top:-8px;bottom:-8px}
.q{position:relative;margin-left:6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);font-size:12px;line-height:1;padding:0;vertical-align:1px}
.q::after{content:'';position:absolute;inset:-11px}.q[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.hp{background:#F1F3EC;border-radius:4px;padding:8px 10px;margin-top:4px}.hpi{opacity:.8}
.tabs{display:flex;gap:0;margin:10px 0 2px;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.tab{flex:1;min-height:44px;background:var(--sheet);border:0;border-left:1px solid var(--ink);font-size:14px;font-weight:500}.tab:first-child{border-left:0}.tab.on{background:var(--ink);color:#fff}
.tabp[hidden]{display:none}.tabp>.sec:first-child{margin-top:12px}
.acts.stick{position:sticky;bottom:-16px;background:var(--sheet);padding:8px 0 12px;margin-bottom:-4px;z-index:2;box-shadow:0 -8px 8px -8px rgba(23,35,28,.18)}
details.rule{border-top:1px solid #E6E9E0;margin:0}details.rule summary{min-height:44px;display:flex;align-items:center;font-weight:500;font-size:14px;cursor:pointer}details.rule summary em{font-style:normal;color:var(--mute);font-weight:400;margin-left:6px;font-size:12px}
.dev h4{min-height:28px;display:flex;align-items:center;flex-wrap:wrap}.dev p .side{color:var(--stamp-dark)}
#rpDots{display:flex;gap:4px;margin:0 4px}#rpDots:empty{display:none}#rpDots i{width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8)}#rpDots i.on{background:#fff;border-color:#fff}#rpBar.end #rpDots{display:none}
.seg{display:flex;gap:2px;height:4px;margin-top:3px}.seg:empty{display:none}.seg i{flex:1;background:var(--line);border-radius:1px}.seg i.on{background:var(--good)}
.pcard em.now{display:block;font-style:normal;font-size:13px;font-weight:500;color:var(--good);margin-top:4px}
.row .nw{white-space:nowrap;flex:none;padding-left:8px}
@media (max-width:379px){.cell i{font-size:11px;letter-spacing:-.2px}}
.chips.qp{margin:0 0 6px}.chips.qp .chip{min-height:44px}.chips.qp .chip.qm{flex:1.15;border-color:var(--ink)}
#turnCal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(23,35,28,0);cursor:pointer;transition:background .18s}
#turnCal[hidden]{display:none}#turnCal.go{background:rgba(23,35,28,.28)}#turnCal.out{opacity:0;transition:opacity .18s}
#turnCal .cal{position:relative;width:176px;height:196px;perspective:600px;transform:translateY(8px) scale(.96);opacity:0;transition:transform .22s cubic-bezier(.22,1,.36,1),opacity .22s}
#turnCal.go .cal{transform:none;opacity:1}
#turnCal .ring{position:absolute;left:0;right:0;top:0;height:28px;background:var(--ink);border-radius:4px 4px 0 0;z-index:3;display:flex;justify-content:space-around;align-items:center}
#turnCal .ring i{width:10px;height:10px;border-radius:50%;background:#F7F8F2;box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
#turnCal .pg{position:absolute;left:0;right:0;top:24px;bottom:0;background:#FBFAF4;border:2px solid var(--ink);border-top:0;border-radius:0 0 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.18);backface-visibility:hidden}
#turnCal .pg small{font-size:14px;color:var(--mute)}
#turnCal .pg b{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;color:var(--ink)}
#turnCal .pg span{font-size:12px;color:var(--mute);margin-top:8px}
#turnCal .pg em{font-style:normal;font-size:12px;color:#fff;background:var(--stamp);border-radius:4px;padding:0 8px;margin-top:4px}
#turnCal .front{z-index:2;transform-origin:50% 0;transition:transform .55s cubic-bezier(.5,0,.75,0) .32s,opacity .2s linear .7s}
#turnCal.go .front{transform:rotateX(-110deg);opacity:0}
#turnCal .ny .back b{color:var(--stamp)}
#turnBanner{position:absolute;z-index:6;display:flex;flex-direction:column;gap:0;background:var(--ink);color:#F7F8F2;border-radius:4px;padding:8px 14px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateX(-12px)}
#turnBanner[hidden]{display:none}
#turnBanner b{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2}
#turnBanner span{font-size:12px;opacity:.85}
#turnBanner.go{animation:tbIn 2s cubic-bezier(.22,1,.36,1) forwards}
@keyframes tbIn{0%{opacity:0;transform:translateX(-12px)}12%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-6px)}}
.qstat.side{font-size:12px;color:var(--mute)}
.why .side,.dev .side{color:#8A2A1C;font-size:12px}
.mw.grudge{color:#8A2A1C}.mw.wary{color:#A4661B}.mw.warm{color:var(--good)}
.boss.adv{background:#F6EDE8;border-left-color:#8A2A1C}
.pcard.pl{position:relative}.pcard.pl.on{border-color:#8A2A1C;box-shadow:inset 0 0 0 2px #8A2A1C;background:#FBF3EE}.pcard.pl em{font-style:normal;font-size:13px;color:#8A2A1C;margin-left:4px}
.zname{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}.zname span{white-space:nowrap;color:var(--mute)}
.zname input{flex:1;min-width:0;height:44px;border:1px solid var(--ink);border-radius:4px;padding:0 12px;font-size:16px;background:#fff}
.acts.two{grid-template-columns:1fr 1fr}
.ic{display:inline-block;width:24px;height:24px;background-repeat:no-repeat;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;flex:none}
.ic.emb{border-radius:4px;box-shadow:0 0 0 2px var(--fc);background-color:var(--sheet);margin:0 7px 0 3px}
.cell small{display:flex;align-items:center;gap:2px;white-space:nowrap;margin:-2px 0 -1px -3px}.cell small .hic{display:inline-block;width:24px;height:24px}
.qdev .ic,.dev h4 .ic{margin:-4px 4px -4px -2px}
.opb .opt{display:flex;gap:8px;align-items:flex-start;min-width:0}.opb .opt>.ic{margin-top:2px}
img.face{image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--ink);border-radius:4px;background:#F3F1E7;flex:none;vertical-align:middle}
.boss{display:flex;gap:10px;align-items:center;text-align:left;margin:10px 0 2px;padding:8px 10px;background:#F1EFE4;border-left:3px solid var(--ink);border-radius:4px}
.boss div{min-width:0}.boss b{font-size:14px}.boss span{font-size:12px;color:#5D6A60}
.boss q{display:block;font-size:14px;line-height:1.45;margin-top:2px;quotes:'\201C' '\201D'}
.plan .boss{margin:0 0 8px;background:rgba(255,255,255,.6)}
.faces{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}.faces.sm{justify-content:flex-start;margin:6px 0 0;gap:4px}
.pcards{display:grid;gap:8px;margin-top:12px;text-align:left}
.pcards.own{grid-template-columns:1fr 1fr;margin-top:6px}

.pcard i{font-style:normal;font-size:12px;font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:1px;white-space:nowrap}.pcard i::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:4px;vertical-align:0}
.pcard b{font-size:15px}.pcard span{display:block;font-size:13px;line-height:1.45;color:#3D4A40;margin-top:4px}
.pcard.own{padding:8px 8px;border-width:1px}.pcard.own b{font-size:14px}.pcard.own span{font-size:12px}
#rpTalk{position:absolute;z-index:31;pointer-events:none}#rpTalk[hidden]{display:none}#rpTalk .boss{margin:0;background:var(--sheet);box-shadow:0 2px 10px rgba(0,0,0,.18);border:1px solid var(--ink);border-left-width:3px}

#quest.done{border-left-color:var(--good);background:#EEF6EF}#quest.pop{animation:qpop .6s}@keyframes qpop{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
